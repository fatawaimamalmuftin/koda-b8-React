<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeliMudah Admin — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#1a73e8',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

</head>

<body class="bg-gray-100 text-gray-900 font-sans flex min-h-screen text-[13px]">

  <!-- sidebar -->
  <aside class="w-[240px] min-w-[240px] bg-gray-900 flex flex-col fixed top-0 left-0 h-full z-[999]">

    <!-- logo -->
    <div class="flex items-center gap-2.5 px-5 pt-5 pb-4 border-b border-gray-800">
      <div
        class="w-8 h-8 bg-[#1a73e8] rounded-lg flex items-center justify-center text-white font-semibold text-sm shrink-0">
        B</div>
      <span class="text-white text-sm font-medium">BeliMudah Admin</span>
    </div>

    <!-- nav -->
    <nav class="flex flex-col gap-0.5 p-3 flex-1">
      <a href="#"
        class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg bg-[#1a73e8] text-white text-[13px] no-underline">
        <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i> Dashboard
      </a>
      <a href="#"
        class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-gray-400 text-[13px] no-underline hover:bg-gray-800 hover:text-gray-200 transition-colors">
        <i data-lucide="package" class="w-4 h-4 shrink-0"></i> Produk
      </a>
      <a href="#"
        class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-gray-400 text-[13px] no-underline hover:bg-gray-800 hover:text-gray-200 transition-colors">
        <i data-lucide="shopping-cart" class="w-4 h-4 shrink-0"></i> Pesanan
      </a>
      <a href="#"
        class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-gray-400 text-[13px] no-underline hover:bg-gray-800 hover:text-gray-200 transition-colors">
        <i data-lucide="users" class="w-4 h-4 shrink-0"></i> Pelanggan
      </a>
      <a href="#"
        class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-gray-400 text-[13px] no-underline hover:bg-gray-800 hover:text-gray-200 transition-colors">
        <i data-lucide="settings" class="w-4 h-4 shrink-0"></i> Pengaturan
      </a>
    </nav>

    <!-- bottom -->
    <div class="px-3 py-3.5 border-t border-gray-800">
      <div
        class="flex items-center gap-2 text-gray-500 text-[13px] cursor-pointer hover:text-gray-200 transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Kembali ke Toko</span>
      </div>
    </div>
  </aside>

  <main class="ml-[240px] flex-1 flex flex-col min-h-screen">
    <!-- topbar -->
    <header class="h-12 bg-white border-b border-gray-200 flex items-center justify-between px-7 sticky top-0 z-[90]">
      <div class="flex items-center gap-2 text-gray-500">
        <i data-lucide="x" class="w-3.5 h-3.5 cursor-pointer"></i>
        <span>Admin</span>
      </div>
      <div class="flex items-center gap-2.5">
        <!-- notif -->
        <div
          class="relative w-8 h-8 border border-gray-200 rounded-lg flex items-center justify-center cursor-pointer bg-white">
          <i data-lucide="bell" class="w-[15px] h-[15px] text-gray-500"></i>
          <div class="absolute top-1.5 right-1.5 w-[7px] h-[7px] bg-red-500 rounded-full border-[1.5px] border-white">
          </div>
        </div>
        <!-- admin -->
        <div class="flex items-center gap-1.5 border border-gray-200 rounded-lg px-2.5 py-1 cursor-pointer bg-white">
          <div
            class="w-[22px] h-[22px] bg-[#1a73e8] rounded-full flex items-center justify-center text-white text-[10px] font-semibold">
            A</div>
          <span>Admin</span>
        </div>
      </div>
    </header>

    <!-- content -->
    <main class="p-7 flex flex-col gap-5">
      <!-- header content -->
      <div class="flex justify-between items-start">
        <div>
          <h1 class="text-[22px] font-semibold text-gray-900">Dashboard</h1>
          <p class="text-[13px] text-gray-500 mt-1">Selamat datang kembali! Ini ringkasan bisnis hari ini.</p>
        </div>
        <span class="text-xs text-gray-500 pt-1">28 Mei 2026</span>
      </div>
    </main>

    <script>
      lucide.createIcons();
    </script>
</body>

</html>
