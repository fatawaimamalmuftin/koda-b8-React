name: otomation tasks
on:
  push:
    tags:
        - v*

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Ambil isi Repo
              uses: actions/checkout@v4

            - name: setup node js
              uses: actions/setup-node@v4
              with:
                node-version: 24
            - name: node module 
              run: npm ci

            # - name: Lint
            #   run: npm run lint

            - name: build
              run: npm run build
            
            - name: upload dist jadi artefact di git
              uses: actions/upload-artifact@v4
              with:
                name: dist
                path: dist/
    build:
        name: bikin images docker
        needs: check

        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: checkout repo
              uses: actions/checkout@v4
            
            - name: login ghcr
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{github.action}}
                password: ${{secrets.GITHUB_TOKEN}}
                
            - name: bikin tag
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ghcr.io/${{github.repository}}
                tags: |
                  type=semver,pattern={{version}}
                  type=semver,pattern={{major}}.{{minor}}
                  type=semver,pattern={{major}}
            
            - name: build & push images
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ${{steps.meta.outputs.tags}}
                label: ${{steps.meta.outputs.latest}}
    release:
        name: Release Github
        needs: build

        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                generate_release_notes: true

    deploy:
        name: Deploy Server
        needs: release

        runs-on: ubuntu-latest

        steps:
            - name: Deploy to VPS
              uses: appleboy/ssh-action@v1.2.0
              with:
                host: ${{ secrets.SERVER_HOST }}
                username: ${{ secrets.SERVER_USERNAME }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                script: |
                  cd /path/ke/project

                  podman compose pull

                  podman compose down

                  podman compose up -d
            